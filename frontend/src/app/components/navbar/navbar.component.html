<nav style="background:#1e293b; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center;">
  <div style="font-weight:700; font-size:16px;">🏠 Home Healthcare Management System</div>
  <div style="display:flex; align-items:center; gap:16px; font-size:14px;">
    <ng-container *ngIf="currentUser as user; else guestLinks">
      <span>{{ user.fullName }} <span style="opacity:0.6;">({{ user.role }})</span></span>
      <button class="btn-secondary" (click)="logout()">Logout</button>
    </ng-container>
    <ng-template #guestLinks>
      <a routerLink="/login" style="color:#fff; text-decoration:none;">Login</a>
      <a routerLink="/register" style="color:#fff; text-decoration:none;">Register</a>
    </ng-template>
  </div>
</nav>
